# Host nginx (Ubuntu) in front of Docker — not the hms-web container nginx.
# The 413 "nginx/1.30.4 (Ubuntu)" on uploadStaffProfilePhoto is from THIS layer
# when client_max_body_size is left at the default (~1m).
#
# Add inside the server { } that terminates TLS for portal.safihospital.com.pk
# (or include this file), then: sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 32m;
