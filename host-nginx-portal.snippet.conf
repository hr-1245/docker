# Edge proxy for portal.safihospital.com.pk — on SAFI-HOSPITAL-CMS this is the
# Docker container named "nginx-proxy" (systemd nginx.service is not active).
# 413 Request Entity Too Large and 504 Gateway Time-out both come from here.
#
# Prefer: docker/nginx-proxy/portal-extra.conf (copy + reload inside the container).
#
# If you ever run host nginx instead, put this inside the TLS server { } block:
client_max_body_size 32m;
proxy_connect_timeout 30s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
