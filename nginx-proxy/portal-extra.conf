# Mount into the docker nginx-proxy container (TLS edge for portal.safihospital.com.pk).
# Host systemd nginx is inactive on SAFI-HOSPITAL-CMS — this container returns 413/504.
#
# Apply (pick the path your container uses):
#   docker cp docker/nginx-proxy/portal-extra.conf nginx-proxy:/etc/nginx/conf.d/portal-extra.conf
#   docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#
# Or bind-mount in compose:
#   volumes:
#     - ./nginx-proxy/portal-extra.conf:/etc/nginx/conf.d/portal-extra.conf:ro

client_max_body_size 32m;

proxy_connect_timeout 30s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;
